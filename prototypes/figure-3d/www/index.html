<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schéma 3D</title>
<style>
  :root { --bg: #FBF8F3; --text: #1C1915; }
  :root[data-theme="dark"] { --bg: #1A1815; --text: #F1ECE3; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  #c { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
  #hud { position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); font: 12px/1.3 ui-monospace, Menlo, monospace; color: var(--text); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 4px 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
